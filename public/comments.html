<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comments</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar">
    <div class="brand">Signal</div>
    <a href="/dashboard.html">Overview</a>
    <a href="/automations.html">Automations</a>
    <a href="/comments.html" class="active">Comments</a>
    <a href="/deals.html">Brand deals</a>
    <a href="/products.html">Products</a>
    <div class="spacer"></div>
    <span class="signout" id="signOut">Sign out</span>
  </nav>
  <main class="main">
    <header><h1>Comments &amp; DMs</h1></header>
    <div class="panel">
      <div id="list"></div>
    </div>
  </main>
</div>
<script src="/js/api.js"></script>
<script>
(async () => {
  await requireLogin();
  const events = await api.get('/comments');
  const list = document.getElementById('list');
  list.innerHTML = events.length
    ? `<table><tr><th>When</th><th>Type</th><th>From</th><th>Content</th><th>Result</th></tr>` +
      events.map(e => `<tr>
        <td>${fmtDate(e.created_at)}</td>
        <td>${e.event_type}</td>
        <td>@${escapeHtml(e.sender_username || e.sender_ig_id || '')}</td>
        <td>${escapeHtml(e.content || '')}</td>
        <td>${e.moderation_action ? `<span class="badge ${e.moderation_action}">${e.moderation_action}</span>` :
             (e.matched ? '<span class="badge matched">automation matched</span>' : '—')}</td>
      </tr>`).join('') + `</table>`
    : '<div class="empty-state">No comments or DMs recorded yet.</div>';
})();

document.getElementById('signOut').addEventListener('click', async () => {
  await api.post('/auth/logout');
  window.location.href = '/login.html';
});
</script>
</body>
</html>
